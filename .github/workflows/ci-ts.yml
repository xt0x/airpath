name: ci-ts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.10.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"
          cache: pnpm

      - run: make pnpm-install

      - run: make ci-ts
