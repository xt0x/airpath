name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ts:
    uses: ./.github/workflows/ci-ts.yml

  go:
    uses: ./.github/workflows/ci-go.yml

  terraform:
    uses: ./.github/workflows/ci-terraform.yml

  security:
    uses: ./.github/workflows/ci-security.yml

  workflows:
    uses: ./.github/workflows/ci-workflows.yml
